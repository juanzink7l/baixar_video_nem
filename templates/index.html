<!doctype html>
<html lang="pt-br">
  <head>
    <style>
.titulo {
    font-size: 45px;
    font-weight: 700;
    color: white;
}
.titulo span {
color: #0c3d3d;
}

.caixa {
    background: rgba(255, 255, 255, 0.15);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
}
  </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baixar vídeo NEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background: linear-gradient(to bottom, rgb(155, 238, 238) 70%, black 100%);">
    <main class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row caixa">
            <div class="d-flex justify-content-center mb-3">
                <h1 class="text-center titulo">Baixar vídeo <span>NEM</span></h1>
            </div>
            <form action="/download" method="POST"> 
                <div class="col-12">
                    <input type="text" class="form-control" name="url" autocomplete="off" placeholder="Cole sua URL📎aqui"required>
                </div>
                <div class="d-flex justify-content-center mt-5">
                    <button type="submit" class="btn btn-primary col-4"><b> Baixar vídeo</b></button>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
